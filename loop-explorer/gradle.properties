# GitHub repository that publishes releases, as owner/name. Empty turns the update check off.
loop.updateRepo=DarkModeBR/LoopApps
# The repository has releases of several apps; only tags starting with this belong to this app.
loop.updateTag=loop-explorer-

# Lint needs more than the default metaspace.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
