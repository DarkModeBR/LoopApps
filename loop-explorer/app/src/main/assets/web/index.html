:root { --accent:{{ACCENT}}; --on-accent:{{ON_ACCENT}}; --bar:{{BAR}}; --on-bar:{{ON_BAR}}; --folder:{{FOLDER}};
  --ok:#2e7d32; --warn:#ef6c00; --bad:#d32f2f; --radius:8px; --side:256px; }
[data-theme=dark] { --bg:#121212; --side-bg:#181818; --surface:#1e1e1e; --raised:#2a2a2a; --hover:rgba(255,255,255,.05); --line:#2b2b2b; --text:#ececec; --muted:#9a9a9a; --shadow:0 10px 30px rgba(0,0,0,.45); --ok-text:#69f0ae; --warn-text:#ffb74d; --bad-text:#ff8a80; }
[data-theme=light] { --bg:#f3f3f3; --side-bg:#fafafa; --surface:#ffffff; --raised:#ececec; --hover:rgba(0,0,0,.04); --line:#e3e3e3; --text:#1f1f1f; --muted:#6b6b6b; --shadow:0 10px 30px rgba(0,0,0,.14); --ok-text:#2e7d32; --warn-text:#e65100; --bad-text:#c62828; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; overflow:hidden; }
button, input, select { font:inherit; color:inherit; }
::selection { background:var(--accent-soft); }
::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--raised); border-radius:10px; border:2px solid transparent; background-clip:padding-box; } ::-webkit-scrollbar-track { background:transparent; }

/* ---------- Shell */
.app { display:grid; grid-template-columns:var(--side) 1fr; height:100vh; }
aside { background:var(--side-bg); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.brand { padding:18px 20px 14px; }
.brand b { display:block; font-size:17px; letter-spacing:.2px; }
.brand small { color:var(--muted); font-size:12.5px; }
.nav { padding:4px 10px; display:flex; flex-direction:column; gap:2px; }
.nav button { display:flex; align-items:center; gap:12px; width:100%; padding:9px 12px; border:0; background:none; border-radius:var(--radius); cursor:pointer; text-align:left; color:var(--text); }
.nav button .bi { font-size:17px; color:var(--muted); width:20px; text-align:center; }
.nav button:hover { background:var(--hover); }
.nav button.on { background:var(--accent-soft); font-weight:600; }
.nav button.on .bi { color:var(--accent-strong); }
.side-title { padding:18px 22px 6px; font-size:11.5px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); }
.drives { padding:0 10px; display:flex; flex-direction:column; gap:2px; overflow:auto; }
.drive { display:flex; gap:12px; align-items:center; padding:9px 12px; border-radius:var(--radius); cursor:pointer; border:0; background:none; width:100%; text-align:left; color:var(--text); }
.drive:hover { background:var(--hover); }
.drive.on { background:var(--accent-soft); }
.drive .bi { font-size:18px; color:var(--muted); }
.drive.on .bi { color:var(--accent-strong); }
.drive .info { flex:1; min-width:0; }
.drive .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.drive small { color:var(--muted); font-size:12px; }
.meter { height:4px; background:var(--raised); border-radius:4px; overflow:hidden; margin:4px 0 2px; }
.meter > i { display:block; height:100%; background:var(--accent-strong); border-radius:4px; }
.side-foot { margin-top:auto; padding:14px 20px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; border-top:1px solid var(--line); }
.live-dot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px rgba(46,125,50,.25); }
.live-dot.off { background:var(--bad); box-shadow:0 0 0 3px rgba(211,47,47,.25); }

main { display:flex; flex-direction:column; min-width:0; min-height:0; }
.view { display:none; flex:1; flex-direction:column; min-height:0; }
.view.on { display:flex; }
.topbar { display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--surface); min-height:62px; flex-wrap:wrap; }
.topbar h2 { margin:0; font-size:18px; font-weight:600; display:flex; align-items:center; gap:10px; }
.topbar h2 .bi { color:var(--muted); }
.spacer { flex:1; }
.scroll { flex:1; overflow:auto; min-height:0; }
.pad { padding:20px; }

/* ---------- Controls */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:36px; padding:0 14px; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface); cursor:pointer; white-space:nowrap; transition:background .12s, border-color .12s; text-decoration:none; color:var(--text); }
.btn:hover { background:var(--raised); }
.btn .bi { font-size:15px; }
.btn.primary { background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:600; }
.btn.primary:hover { filter:brightness(1.08); }
.btn.danger { color:var(--bad-text); }
.btn.danger.solid { background:var(--bad); color:#fff; border-color:transparent; }
.btn.ghost { border-color:transparent; background:none; }
.btn.ghost:hover { background:var(--hover); }
.btn.icon { width:36px; padding:0; }
.btn:disabled { opacity:.4; cursor:default; pointer-events:none; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.seg button { border:0; background:var(--surface); height:34px; width:38px; cursor:pointer; color:var(--muted); }
.seg button.on { background:var(--accent-soft); color:var(--accent-strong); }
.field { position:relative; display:inline-flex; align-items:center; }
.field .bi { position:absolute; left:11px; color:var(--muted); pointer-events:none; }
.input, select.input { height:36px; border:1px solid var(--line); background:var(--bg); border-radius:var(--radius); padding:0 12px; outline:none; min-width:0; }
.field .input { padding-left:34px; }
.input:focus { border-color:var(--accent-strong); box-shadow:0 0 0 3px var(--accent-soft); }
select.input { padding-right:30px; appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 15px) 16px, calc(100% - 10px) 16px; background-size:5px 5px; background-repeat:no-repeat; }
.check { appearance:none; width:18px; height:18px; border:2px solid var(--muted); border-radius:5px; margin:0; cursor:pointer; display:inline-grid; place-content:center; flex:none; background:transparent; vertical-align:middle; }
.check::after { content:""; width:9px; height:5px; border:2px solid var(--on-accent); border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px); opacity:0; }
.check:checked { background:var(--accent); border-color:var(--accent); }
.check:checked::after { opacity:1; }
.check:indeterminate { background:var(--accent); border-color:var(--accent); }
.check:indeterminate::after { width:8px; height:0; border-left:0; transform:none; opacity:1; }
.switch { display:inline-flex; align-items:center; gap:10px; cursor:pointer; user-select:none; color:var(--muted); white-space:nowrap; }
.switch input { appearance:none; width:36px; height:20px; border-radius:20px; background:var(--raised); position:relative; cursor:pointer; margin:0; transition:background .15s; border:1px solid var(--line); }
.switch input::after { content:""; position:absolute; width:14px; height:14px; border-radius:50%; background:var(--muted); top:2px; left:2px; transition:transform .15s, background .15s; }
.switch input:checked { background:var(--accent); border-color:transparent; }
.switch input:checked::after { transform:translateX(16px); background:var(--on-accent); }
.badge { display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
.badge.ok { background:rgba(46,125,50,.16); color:var(--ok-text); }
.badge.suspect { background:rgba(239,108,0,.16); color:var(--warn-text); }
.badge.fake { background:rgba(211,47,47,.16); color:var(--bad-text); }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.card-head { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); font-weight:600; }
.card-head .bi { color:var(--muted); font-size:16px; }
.card-body { padding:14px 18px; }
.muted { color:var(--muted); }
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--muted); padding:60px 20px; text-align:center; }
.empty .bi { font-size:46px; opacity:.6; }
.empty b { color:var(--text); font-size:16px; }

/* ---------- Files */
.crumbs { display:flex; align-items:center; gap:2px; min-width:0; flex:1; overflow:hidden; }
.crumbs button { border:0; background:none; padding:6px 8px; border-radius:6px; cursor:pointer; white-space:nowrap; color:var(--muted); max-width:220px; overflow:hidden; text-overflow:ellipsis; }
.crumbs button:hover { background:var(--hover); color:var(--text); }
.crumbs button:last-child { color:var(--text); font-weight:600; }
.crumbs .sep { color:var(--muted); font-size:11px; opacity:.7; }
.cmdbar { display:flex; align-items:center; gap:4px; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--surface); min-height:52px; overflow:hidden; }
.cmdbar .btn.primary { margin-right:4px; }
.cmdbar .btn:disabled { opacity:.3; }
.vsep { width:1px; height:22px; background:var(--line); margin:0 8px; flex:none; }
.clipchip { display:none; align-items:center; gap:8px; padding:4px 6px 4px 12px; border-radius:20px; background:var(--accent-soft); white-space:nowrap; margin-right:10px; }
.clipchip.on { display:inline-flex; }
.clipchip button { border:0; background:none; cursor:pointer; color:var(--muted); padding:2px 6px; border-radius:10px; }
.clipchip button:hover { background:var(--hover); color:var(--text); }
#selCount { white-space:nowrap; }
@media (max-width: 1400px) { .cmdbar .lbl { display:none; } .cmdbar .btn.ghost:not(.icon) { width:36px; padding:0; } }
.files { position:relative; }
table.list { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; }
.list th { position:sticky; top:0; z-index:1; background:var(--bg); text-align:left; font-weight:600; font-size:12.5px; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; white-space:nowrap; }
.list th:hover { color:var(--text); }
.list th .bi { font-size:11px; margin-left:4px; }
.list td { padding:0 12px; height:46px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list tr.row { cursor:default; }
.list tr.row:hover td { background:var(--hover); }
.list tr.row.sel td { background:var(--accent-soft); }
.list tr.row.cut td { opacity:.5; }
.list .c-check { width:46px; text-align:center; padding:0 0 0 14px; }
.list .c-size { width:110px; text-align:right; }
.list .c-type { width:170px; }
.list .c-date { width:170px; }
.list td.c-size, .list td.c-type, .list td.c-date { color:var(--muted); }
.fname { display:flex; align-items:center; gap:12px; min-width:0; }
.fname span { overflow:hidden; text-overflow:ellipsis; }
.ficon { width:32px; height:32px; border-radius:7px; display:grid; place-items:center; flex:none; font-size:17px; position:relative; overflow:hidden; }
.ficon img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; padding:16px 20px; }
.tile { border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden; cursor:default; position:relative; user-select:none; }
.tile:hover { border-color:var(--muted); }
.tile.sel { border-color:var(--accent-strong); box-shadow:0 0 0 2px var(--accent-soft); }
.tile.cut { opacity:.5; }
.tile .thumb { height:110px; display:grid; place-items:center; font-size:44px; position:relative; overflow:hidden; }
.tile .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.tile .label { padding:8px 10px 10px; }
.tile .label div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile .label small { color:var(--muted); }
.tile .check { position:absolute; top:8px; left:8px; z-index:1; opacity:0; }
.tile .check:not(:checked) { background:var(--surface); }
.tile:hover .check, .tile.sel .check { opacity:1; }
.statusbar { display:flex; align-items:center; gap:16px; padding:8px 20px; border-top:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:12.5px; }
.dropzone { position:absolute; inset:10px; border:2px dashed var(--accent-strong); border-radius:14px; background:color-mix(in srgb, var(--bg) 85%, transparent); display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; z-index:5; font-size:16px; pointer-events:none; }
.dropzone .bi { font-size:48px; color:var(--accent-strong); }
.dropping .dropzone { display:flex; }

/* ---------- Menus, dialogs, toasts */
.menu { position:fixed; z-index:50; min-width:230px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:6px; display:none; }
.menu.on { display:block; }
.menu button { display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; padding:8px 10px; border-radius:6px; cursor:pointer; text-align:left; color:var(--text); }
.menu button:hover { background:var(--hover); }
.menu button .bi { width:18px; color:var(--muted); }
.menu button.danger, .menu button.danger .bi { color:var(--bad-text); }
.menu button kbd { margin-left:auto; font:11.5px system-ui; color:var(--muted); }
.menu hr { border:0; border-top:1px solid var(--line); margin:5px 2px; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; }
.overlay.on { display:flex; }
.dialog { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); width:min(460px, 100%); max-height:90vh; display:flex; flex-direction:column; }
.dialog.wide { width:min(640px, 100%); }
.dialog h3 { margin:0; padding:18px 20px 6px; font-size:17px; display:flex; align-items:center; gap:10px; }
.dialog .text { padding:4px 20px 0; color:var(--muted); }
.dialog .body { padding:14px 20px; overflow:auto; }
.dialog .body .input { width:100%; }
.dialog .actions { display:flex; justify-content:flex-end; gap:8px; padding:12px 20px 18px; }
.picker-list { border:1px solid var(--line); border-radius:10px; height:300px; overflow:auto; margin-top:10px; }
.picker-list button { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:9px 12px; cursor:pointer; text-align:left; border-bottom:1px solid var(--line); color:var(--text); }
.picker-list button:hover { background:var(--hover); }
.picker-list .bi { color:var(--folder); }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:4px 12px; cursor:pointer; font-size:13px; color:var(--text); }
.chip.on { background:var(--accent-soft); border-color:transparent; }
.props { display:grid; grid-template-columns:120px 1fr; gap:8px 14px; }
.props span:nth-child(odd) { color:var(--muted); }
.props span:nth-child(even) { word-break:break-all; }
.toasts { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:70; align-items:center; }
.toast { background:#2b2b2b; color:#fff; padding:10px 16px; border-radius:10px; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; max-width:90vw; animation:pop .15s ease-out; }
.toast .bi { color:#69f0ae; } .toast.bad .bi { color:#ff8a80; }
@keyframes pop { from { transform:translateY(8px); opacity:0; } }
.uploads { position:fixed; right:20px; bottom:20px; width:340px; z-index:40; display:none; }
.uploads.on { display:block; }
.upl { padding:10px 18px; border-bottom:1px solid var(--line); }
.upl:last-child { border-bottom:0; }
.upl div { display:flex; justify-content:space-between; gap:10px; font-size:13px; }
.upl div span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- Status */
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:14px; margin-bottom:16px; }
.kpi { display:flex; align-items:center; gap:16px; padding:16px 18px; }
.ring { --p:0; width:62px; height:62px; border-radius:50%; flex:none; background:conic-gradient(var(--accent-strong) calc(var(--p) * 1%), var(--raised) 0); display:grid; place-items:center; }
.ring::before { content:""; grid-area:1/1; width:48px; height:48px; border-radius:50%; background:var(--surface); }
.ring .bi { grid-area:1/1; font-size:20px; color:var(--muted); }
.kpi .label { color:var(--muted); font-size:12.5px; }
.kpi .value { font-size:21px; font-weight:600; }
.kpi .sub { color:var(--muted); font-size:12.5px; }
.status-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px; align-items:start; }
.kv { display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px solid var(--line); }
.kv:last-child { border-bottom:0; }
.kv span:last-child { text-align:right; word-break:break-word; }
.checks-sum { display:flex; gap:8px; margin-left:auto; }
.chk { display:flex; gap:14px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
.chk:last-child { border-bottom:0; }
.chk > .bi { font-size:20px; margin-top:1px; }
.chk .bi.ok { color:var(--ok-text); } .chk .bi.suspect { color:var(--warn-text); } .chk .bi.fake { color:var(--bad-text); }
.chk .txt { flex:1; }
.chk .txt div { color:var(--muted); }

/* ---------- Terminal */
.term-wrap { display:grid; grid-template-columns:1fr 280px; gap:16px; padding:20px; flex:1; min-height:0; }
.term { background:#0c0c0c; border:1px solid #262626; border-radius:12px; display:flex; flex-direction:column; min-height:0; overflow:hidden; color:#e6e6e6; }
.term-head { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#161616; border-bottom:1px solid #262626; font-size:13px; color:#a8a8a8; }
.dots { display:flex; gap:6px; } .dots i { width:11px; height:11px; border-radius:50%; display:block; }
.term-head .btn { height:28px; padding:0 10px; background:#1f1f1f; border-color:#2e2e2e; color:#cfcfcf; font-size:12.5px; }
.term-head .btn:hover { background:#2a2a2a; }
.term-out { flex:1; overflow:auto; padding:14px 16px; font:13px/1.5 ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace; white-space:pre-wrap; word-break:break-all; }
.term-out .cmd { color:#fff; margin-top:6px; } .term-out .cmd b { color:#69f0ae; font-weight:600; }
.term-out .err { color:#ff8a80; } .term-out .info { color:#8a8a8a; }
.term-in { display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid #262626; background:#111; font:13px ui-monospace, Consolas, monospace; }
.term-in b { color:#69f0ae; }
.term-in input { flex:1; background:none; border:0; outline:none; color:#fff; font:inherit; }
.quick { display:flex; flex-direction:column; min-height:0; }
.quick .card-body { overflow:auto; display:flex; flex-direction:column; gap:6px; }
.quick button { display:flex; flex-direction:column; align-items:flex-start; gap:2px; border:1px solid var(--line); background:var(--bg); border-radius:var(--radius); padding:8px 12px; cursor:pointer; text-align:left; color:var(--text); }
.quick button:hover { border-color:var(--muted); }
.quick button code { font-size:12px; color:var(--muted); }

/* ---------- Apps */
.apps { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }
.appc { display:flex; align-items:center; gap:14px; padding:14px; }
.appc img { width:46px; height:46px; border-radius:10px; flex:none; background:var(--raised); }
.appc .info { flex:1; min-width:0; }
.appc .info div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.appc .info small { color:var(--muted); }
.appc .acts { display:flex; gap:4px; }
.progress-line { height:3px; background:var(--accent-strong); width:0; transition:width .2s; }

/* ---------- Screen and power */
.shot-box { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; min-height:0; }
.shot-box img { max-width:100%; max-height:100%; border-radius:12px; border:1px solid var(--line); box-shadow:var(--shadow); background:#000; }
.power { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; }
.pcard { padding:26px 22px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; }
.pcard .circle { width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-size:28px; background:var(--raised); }
.pcard.danger .circle { background:rgba(211,47,47,.15); color:var(--bad-text); }
.pcard b { font-size:16px; }
.pcard p { margin:0 0 6px; color:var(--muted); min-height:42px; }
.note { display:flex; gap:10px; align-items:flex-start; color:var(--muted); margin-top:16px; }

@media (max-width: 900px) {
  :root { --side:68px; }
  .brand, .side-title, .drive .info, .nav button span, .side-foot span { display:none; }
  .nav button, .drive { justify-content:center; padding:11px 0; }
  .nav { padding-top:12px; }
  .term-wrap { grid-template-columns:1fr; }
  .quick { display:none; }
}
@media (max-width: 640px) {
  .list .c-type, .list .c-date { display:none; }
  .topbar { padding:10px 12px; }
  .grid { padding:12px; }
  .hide-sm { display:none !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>Loop Explorer</b><small>{{DEVICE}}</small></div>
    <div class="nav" id="nav"></div>
    <div class="side-title" data-t="storage"></div>
    <div class="drives" id="drives"></div>
    <div class="side-foot"><i class="live-dot" id="liveDot"></i><span id="liveText"></span></div>
  </aside>

  <main>
    <!-- Files -->
    <section class="view" id="files">
      <div class="topbar">
        <button class="btn icon ghost" id="refreshFiles" data-tt="refresh"><i class="bi bi-arrow-clockwise"></i></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="field hide-sm"><i class="bi bi-search"></i><input class="input" id="filter" data-tp="filter" style="width:220px"></div>
        <div class="seg"><button id="viewList" data-tt="view_list"><i class="bi bi-list-ul"></i></button><button id="viewGrid" data-tt="view_grid"><i class="bi bi-grid-3x3-gap"></i></button></div>
      </div>
      <div class="cmdbar">
        <button class="btn primary" id="upload"><i class="bi bi-upload"></i><span class="hide-sm" data-t="upload"></span></button>
        <button class="btn" id="mkdir"><i class="bi bi-folder-plus"></i><span class="hide-sm" data-t="new_folder"></span></button>
        <input type="file" id="picker" multiple hidden>
        <i class="vsep"></i>
        <button class="btn icon ghost" data-sel="cut" data-tt="cut"><i class="bi bi-scissors"></i></button>
        <button class="btn icon ghost" data-sel="copy" data-tt="copy"><i class="bi bi-copy"></i></button>
        <button class="btn icon ghost" id="paste" data-tt="paste_here"><i class="bi bi-clipboard"></i></button>
        <button class="btn icon ghost" data-sel="rename" data-tt="rename"><i class="bi bi-pencil"></i></button>
        <button class="btn icon ghost danger" data-sel="delete" data-tt="delete"><i class="bi bi-trash3"></i></button>
        <i class="vsep"></i>
        <button class="btn ghost" data-sel="download" data-tt="download"><i class="bi bi-download"></i><span class="lbl" data-t="download"></span></button>
        <button class="btn ghost" data-sel="copyTo" data-tt="copy_to"><i class="bi bi-folder-symlink"></i><span class="lbl" data-t="copy_to"></span></button>
        <button class="btn ghost" data-sel="moveTo" data-tt="move_to"><i class="bi bi-arrows-move"></i><span class="lbl" data-t="move_to"></span></button>
        <button class="btn ghost" data-sel="zip" data-tt="zip"><i class="bi bi-file-earmark-zip"></i><span class="lbl" data-t="zip"></span></button>
        <button class="btn ghost" data-sel="unzip" data-tt="extract"><i class="bi bi-box-arrow-in-down"></i><span class="lbl" data-t="extract"></span></button>
        <span class="spacer"></span>
        <span class="clipchip" id="clipChip"><i class="bi bi-clipboard-check"></i><span id="clipText"></span><button id="clipCancel" data-tt="cancel"><i class="bi bi-x-lg"></i></button></span>
        <span class="muted" id="selCount"></span>
      </div>
      <div class="scroll files" id="filesBox">
        <div id="fileArea"></div>
        <div class="dropzone"><i class="bi bi-cloud-arrow-up"></i><span id="dropText"></span></div>
      </div>
      <div class="statusbar"><span id="countText"></span><span class="spacer"></span>
        <label class="switch"><input type="checkbox" id="hidden"><span data-t="hidden"></span></label></div>
    </section>

    <!-- Status -->
    <section class="view" id="status">
      <div class="topbar"><h2><i class="bi bi-activity"></i><span data-t="tab_status"></span></h2><span class="spacer"></span>
        <label class="switch"><input type="checkbox" id="autoStatus" checked><span data-t="auto_status"></span></label>
        <button class="btn" id="refreshStatus"><i class="bi bi-arrow-clockwise"></i><span data-t="refresh"></span></button></div>
      <div class="scroll pad">
        <div class="kpis" id="kpis"></div>
        <div class="status-grid">
          <div class="card" style="grid-column:1/-1"><div class="card-head"><i class="bi bi-shield-check"></i><span data-t="checks_title"></span><div class="checks-sum" id="checksSum"></div></div>
            <div class="card-body"><div class="muted" data-t="checks_intro" style="margin-bottom:4px"></div><div id="checks"></div></div></div>
        </div>
        <div class="status-grid" id="sections" style="margin-top:14px"></div>
      </div>
    </section>

    <!-- Terminal -->
    <section class="view" id="terminal">
      <div class="topbar"><h2><i class="bi bi-terminal"></i><span data-t="tab_terminal"></span></h2><span class="spacer"></span><span class="badge" id="mode"></span><span class="muted hide-sm" id="modeText"></span></div>
      <div class="term-wrap">
        <div class="term">
          <div class="term-head"><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
            <span id="termTitle">shell</span><span class="spacer"></span>
            <button class="btn" id="termCopy"><i class="bi bi-copy"></i><span data-t="copy"></span></button>
            <button class="btn" id="termClear"><i class="bi bi-eraser"></i><span data-t="clear"></span></button></div>
          <div class="term-out" id="out"></div>
          <div class="term-in"><b>$</b><input id="cmd" autocomplete="off" spellcheck="false" data-tp="type_command"></div>
        </div>
        <div class="card quick"><div class="card-head"><i class="bi bi-lightning-charge"></i><span data-t="quick"></span></div><div class="card-body" id="quick"></div></div>
      </div>
    </section>

    <!-- Apps -->
    <section class="view" id="apps">
      <div class="topbar"><h2><i class="bi bi-grid-3x3-gap"></i><span data-t="tab_apps"></span></h2><span class="muted" id="appCount"></span><span class="spacer"></span>
        <div class="field"><i class="bi bi-search"></i><input class="input" id="search" data-tp="search" style="width:220px"></div>
        <label class="switch hide-sm"><input type="checkbox" id="system"><span data-t="system_apps"></span></label>
        <button class="btn primary" id="installBtn"><i class="bi bi-box-arrow-in-down"></i><span data-t="install_apk"></span></button>
        <input type="file" id="apkPicker" accept=".apk" hidden></div>
      <div class="progress-line" id="appProgress"></div>
      <div class="scroll pad"><div class="apps" id="appList"></div></div>
    </section>

    <!-- Screen -->
    <section class="view" id="screen">
      <div class="topbar"><h2><i class="bi bi-display"></i><span data-t="tab_screen"></span></h2><span class="muted" id="shotTime"></span><span class="spacer"></span>
        <label class="switch"><input type="checkbox" id="auto"><span data-t="auto_refresh"></span></label>
        <a class="btn" id="shotSave" download><i class="bi bi-download"></i><span data-t="save"></span></a>
        <button class="btn primary" id="shotBtn"><i class="bi bi-camera"></i><span data-t="take_shot"></span></button></div>
      <div class="shot-box" id="shotBox"></div>
    </section>

    <!-- Power -->
    <section class="view" id="power">
      <div class="topbar"><h2><i class="bi bi-power"></i><span data-t="tab_power"></span></h2></div>
      <div class="scroll pad">
        <div class="power">
          <div class="card pcard"><div class="circle"><i class="bi bi-moon-stars"></i></div><b data-t="sleep"></b><p data-t="sleep_text"></p><button class="btn" data-power="sleep"><i class="bi bi-moon"></i><span data-t="sleep"></span></button></div>
          <div class="card pcard danger"><div class="circle"><i class="bi bi-arrow-clockwise"></i></div><b data-t="reboot"></b><p data-t="reboot_text"></p><button class="btn danger" data-power="reboot"><i class="bi bi-arrow-clockwise"></i><span data-t="reboot"></span></button></div>
          <div class="card pcard danger"><div class="circle"><i class="bi bi-power"></i></div><b data-t="shutdown"></b><p data-t="shutdown_text"></p><button class="btn danger solid" data-power="shutdown"><i class="bi bi-power"></i><span data-t="shutdown"></span></button></div>
        </div>
        <div class="note"><i class="bi bi-info-circle"></i><span data-t="power_note"></span></div>
      </div>
    </section>
  </main>
</div>

<div class="menu" id="menu"></div>
<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts"></div>
<div class="card uploads" id="uploads"><div class="card-head"><i class="bi bi-cloud-arrow-up"></i><span data-t="uploads"></span><span class="spacer"></span><button class="btn icon ghost" id="uploadsClose"><i class="bi bi-x-lg"></i></button></div><div id="uploadList"></div></div>

async function run(promise) { toast(t('working'), false, 'bi-hourglass-split'); try { await promise; toast(t('done')); } catch (e) { fail(e); } reload(); }

async function rename(it) { const name = await dialog({ title:t('ask_rename'), icon:'bi-pencil', text:t('ask_rename_text'), input:it.name }); if (name && name !== it.name) run(post('/api/rename', { path:it.path, name })); }
async function zip(list) {

async function remove(list) { if (await dialog({ title:t('ask_delete'), icon:'bi-trash3', text:t('ask_delete_text', { n:list.length }), ok:t('delete'), danger:true })) { selected.clear(); run(post('/api/delete', { paths:list.map(i => i.path) })); } }

function setClip(list, move) { clip = { paths:list.map(i => i.path), move }; paint(); }
// A copy can be pasted again and again; what was cut moves once and leaves the clipboard.
function paste(dest) { if (!clip) return; const c = clip; if (c.move) clip = null; run(post('/api/copy', { paths:c.paths, dest, move:c.move })); }
async function sendTo(list, move) { const dest = await pickFolder(move ? t('pick_move') : t('pick_copy')); if (dest) run(post('/api/copy', { paths:list.map(i => i.path), dest, move })); }

  const rows = [[t('name'), it.name], [t('type'), typeOf(it)], [t('path'), it.path], [t('size'), it.dir ? (it.count != null ? t('items', { n:it.count }) : '') : size(it.size) + ' (' + it.size.toLocaleString() + ' B)'], [t('modified'), DATE.format(new Date(it.modified))]];

/** Lets the user walk the storages and choose a folder, instead of typing a path. */
function pickFolder(title) {
  let path = cwd.path;
  return dialog({ title, icon:'bi-folder-symlink', ok:t('pick_here'), wide:true, build: body => {
    const draw = async () => {
      let data;
      try { data = await api('/api/list?path=' + encodeURIComponent(path)); } catch (e) { fail(e); return; }
      const root = rootOf(path);
      const folders = data.items.filter(i => i.dir);
      body.innerHTML = `<div class="chips">${roots.map((r, i) => `<button class="chip${root === r ? ' on' : ''}" data-r="${i}"><i class="bi ${r.usb ? 'bi-usb-drive' : 'bi-hdd'}"></i> ${esc(r.label)}</button>`).join('')}</div>
        <div class="muted" style="margin-top:12px;word-break:break-all"><i class="bi bi-folder2-open"></i> ${esc(path)}</div>
        <div class="picker-list">${data.parent ? `<button data-p="${esc(data.parent)}"><i class="bi bi-arrow-90deg-up" style="color:var(--muted)"></i>..</button>` : ''}
        ${folders.map(f => `<button data-p="${esc(f.path)}"><i class="bi bi-folder-fill"></i>${esc(f.name)}</button>`).join('') || `<div class="empty" style="padding:40px">${t('no_folders')}</div>`}</div>`;
      body.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { path = roots[b.dataset.r].path; draw(); });
      body.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { path = b.dataset.p; draw(); });

}

addEventListener('keydown', e => {
  if (current !== 'files' || $('overlay').classList.contains('on')) return;
  if (e.key === 'Escape') { closeMenu(); if (selected.size) { selected.clear(); paint(); } return; }
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
  if (e.key === 'Enter' && document.activeElement?.tagName === 'BUTTON') return;
  const list = chosen(), ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === 'a') { e.preventDefault(); selected = new Set(shown.map(i => i.path)); paint(); }
  else if (ctrl && e.key.toLowerCase() === 'c' && list.length) setClip(list, false);
  else if (ctrl && e.key.toLowerCase() === 'x' && list.length) setClip(list, true);
  else if (ctrl && e.key.toLowerCase() === 'v' && clip) paste(cwd.path);
  else if (e.key === 'Delete' && list.length) remove(list);
  else if (e.key === 'F2' && list.length === 1) { e.preventDefault(); rename(list[0]); }
  else if (e.key === 'Enter' && list.length === 1) openItem(list[0]);
  else if (e.key === 'Backspace') { e.preventDefault(); goUp(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const i = Math.max(-1, Math.min(shown.length - 1, (anchor < 0 ? -1 : anchor) + (e.key === 'ArrowDown' ? 1 : -1)));
    if (i >= 0) { pick(i, e.shiftKey ? e : null); $('fileArea').querySelector(`[data-i="${i}"]`)?.scrollIntoView({ block:'nearest' }); }

function send(url, file, line) {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('X-Loop', '1');
    x.upload.onprogress = e => e.lengthComputable && line(Math.round(e.loaded * 100 / e.total));
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch (_) {} x.status < 300 ? ok(d) : bad(new Error(d.error || x.status)); };
    x.onerror = () => bad(new Error('network'));
    x.send(file);
  });
}

// ---------- Status
function format(key, value) {
  if (['ram_total','ram_free','ram_kernel','swap','storage_data','storage_data_free','storage_physical'].includes(key)) return size(value);
  if (key === 'uptime') return since(value);
  if (value === true) return t('yes'); if (value === false) return t('no');
  return value;
}
function argsFor(c) {
  const a = Object.assign({}, c.args);
  ['claimed','real'].forEach(k => { if ((c.key === 'check_ram' || c.key === 'check_storage') && typeof a[k] === 'number') a[k] = size(a[k]); });
  return a;
}
const SECTION_ICON = { device:'bi-tv', cpu:'bi-cpu', memory:'bi-memory', storage:'bi-device-hdd', display:'bi-aspect-ratio' };
const CHECK_ICON = { ok:'bi-check-circle-fill', suspect:'bi-exclamation-triangle-fill', fake:'bi-x-octagon-fill' };
function kpi(icon, label, value, sub, p) {
  return `<div class="card kpi"><div class="ring" style="--p:${p == null ? 0 : Math.max(0, Math.min(100, p))}"><i class="bi ${icon}"></i></div>
    <div><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub || '')}</div></div></div>`;
}
let statusBusy = false;
async function loadStatus() {
  if (statusBusy) return; statusBusy = true;
  try {
    const s = await api('/api/status');
    const row = (sec, key) => { const x = s.sections.find(v => v.key === sec); const r = x && x.rows.find(v => v.key === key); return r ? r.value : null; };
    const live = s.live, ramUsed = live.ramTotal - live.ramFree;
    const dataTotal = row('storage', 'storage_data'), dataFree = row('storage', 'storage_data_free');
    const temp = row('cpu', 'cpu_temp'), tempN = temp ? parseFloat(temp) : null;
    $('kpis').innerHTML = [
      kpi('bi-cpu', t('kpi_cpu'), live.cpu == null ? '—' : live.cpu + '%', row('cpu', 'cpu_hardware') || '', live.cpu),
      kpi('bi-memory', t('kpi_ram'), Math.round(ramUsed * 100 / live.ramTotal) + '%', t('used_of', { used:size(ramUsed), total:size(live.ramTotal) }), ramUsed * 100 / live.ramTotal),
      dataTotal ? kpi('bi-device-hdd', t('kpi_storage'), Math.round((dataTotal - dataFree) * 100 / dataTotal) + '%', t('used_of', { used:size(dataTotal - dataFree), total:size(dataTotal) }), (dataTotal - dataFree) * 100 / dataTotal) : '',
      kpi('bi-thermometer-half', t('kpi_temp'), temp || '—', temp ? '' : t('no_reading'), tempN == null ? 0 : tempN),
      kpi('bi-clock-history', t('kpi_uptime'), since(live.uptime), '', 100),
    ].join('');
    const count = st => s.checks.filter(c => c.status === st).length;
    $('checksSum').innerHTML = ['ok','suspect','fake'].filter(st => count(st)).map(st => `<span class="badge ${st}">${t('sum_' + st, { n:count(st) })}</span>`).join('');
    $('checks').innerHTML = s.checks.length ? s.checks.map(c => `<div class="chk"><i class="bi ${CHECK_ICON[c.status]} ${c.status}"></i>
      <div class="txt"><b>${t(c.key)}</b><div>${esc(t(c.key + '_' + c.status, argsFor(c)))}</div></div><span class="badge ${c.status}">${t('st_' + c.status)}</span></div>`).join('')
      : `<div class="muted" style="padding:10px 0">${t('no_checks')}</div>`;
    $('sections').innerHTML = s.sections.map(sec => `<div class="card"><div class="card-head"><i class="bi ${SECTION_ICON[sec.key] || 'bi-info-circle'}"></i>${t('sec_' + sec.key)}</div>
      <div class="card-body">${sec.rows.map(r => `<div class="kv"><span class="muted">${t(r.key)}</span><span>${esc(format(r.key, r.value))}</span></div>`).join('')}</div></div>`).join('');

[['bi-info-square','q_model','getprop ro.product.model'], ['bi-hdd','q_df','df -h'], ['bi-memory','q_free','free -h'], ['bi-list-task','q_top','top -n 1 -b | head -20'],

async function exec() {
  const command = $('cmd').value.trim(); if (!command) return;
  past.push(command); back = past.length; $('cmd').value = '';
  line('cmd', `<b>$</b> ${esc(command)}`);
  const wait = line('info', esc(t('running')));
  try {
    const r = await post('/api/shell', { command });
    wait.remove();
    if (r.output) line('', esc(r.output.replace(/\n$/, '')));
    if (r.exit) line('err', '[exit ' + r.exit + ']');
  } catch (e) { wait.remove(); line('err', esc(t('error', { e:e.message }))); }
}
$('cmd').onkeydown = e => {
  if (e.key === 'Enter') exec();
  if (e.key === 'ArrowUp' && back > 0) { $('cmd').value = past[--back]; e.preventDefault(); }
  if (e.key === 'ArrowDown') { back = Math.min(past.length, back + 1); $('cmd').value = past[back] || ''; }
};
